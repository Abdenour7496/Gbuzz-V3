# Production hardening for application services. Standalone: combine with
# docker-compose.yml plus any feature overlays. When the observability profile is
# enabled, also add docker-compose.observability-production.yml.
x-app-hardening: &app-hardening
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  init: true
  read_only: true
  tmpfs:
    - /tmp:size=128m,mode=1777
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"

services:
  relay:
    <<: *app-hardening
    environment:
      BUZZ_AUTO_MIGRATE: "false"
    mem_limit: ${RELAY_MEMORY_LIMIT:-1g}
    cpus: ${RELAY_CPU_LIMIT:-1.0}

  gcor-proxy:
    <<: *app-hardening
    environment:
      STACK_API_SECRET: ${STACK_API_SECRET:?set STACK_API_SECRET}
      AUDIT_PACK_SIGNING_KEY: ${AUDIT_PACK_SIGNING_KEY:?set AUDIT_PACK_SIGNING_KEY}
      ENFORCE_STACK_API_SECRET: "true"
      REQUIRE_WORKLOAD_IDENTITY: "true"
      REMOTE_FETCH_BLOCK_PRIVATE_HOSTS: "true"
    mem_limit: ${GCOR_PROXY_MEMORY_LIMIT:-1g}
    cpus: ${GCOR_PROXY_CPU_LIMIT:-1.0}

  mcp-postgres-gcor:
    <<: *app-hardening
    mem_limit: ${GCOR_MCP_MEMORY_LIMIT:-512m}
    cpus: ${GCOR_MCP_CPU_LIMIT:-0.5}

  gcor-event-projector:
    <<: *app-hardening
    mem_limit: ${EVENT_PROJECTOR_MEMORY_LIMIT:-512m}
    cpus: ${EVENT_PROJECTOR_CPU_LIMIT:-0.5}

  docker-socket-proxy:
    init: true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    mem_limit: ${DOCKER_SOCKET_PROXY_MEMORY_LIMIT:-64m}
    cpus: ${DOCKER_SOCKET_PROXY_CPU_LIMIT:-0.25}

  recovery-controller:
    init: true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    mem_limit: ${RECOVERY_CONTROLLER_MEMORY_LIMIT:-128m}
    cpus: ${RECOVERY_CONTROLLER_CPU_LIMIT:-0.25}
