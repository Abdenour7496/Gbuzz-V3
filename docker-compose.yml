services:
  relay:
    image: ${BUZZ_IMAGE:-ghcr.io/block/buzz:sha-7ebf1be}
    restart: unless-stopped
    env_file: ${BUZZ_ENV_FILE:-.env}
    environment:
      BUZZ_BIND_ADDR: 0.0.0.0:3000
      BUZZ_HEALTH_PORT: "8080"
      BUZZ_METRICS_PORT: "9102"
      BUZZ_RELAY_PUBLIC_URL: http://127.0.0.1:3000
      DATABASE_URL: postgres://${POSTGRES_USER:-buzz}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-buzz}
      REDIS_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD}@redis:6379
      BUZZ_S3_ENDPOINT: http://minio:9000
      BUZZ_S3_ADDRESSING_STYLE: path
      BUZZ_S3_ACCESS_KEY: ${BUZZ_S3_ACCESS_KEY:?set BUZZ_S3_ACCESS_KEY}
      BUZZ_S3_SECRET_KEY: ${BUZZ_S3_SECRET_KEY:?set BUZZ_S3_SECRET_KEY}
      BUZZ_S3_BUCKET: ${BUZZ_S3_BUCKET:-buzz-media}
      BUZZ_GIT_REPO_PATH: /data/git
      BUZZ_AUTO_MIGRATE: ${BUZZ_AUTO_MIGRATE:-true}
      BUZZ_GIT_CONFORMANCE_PROBE: ${BUZZ_GIT_CONFORMANCE_PROBE:-true}
    ports:
      - "${BUZZ_HTTP_BIND_ADDR:-127.0.0.1}:${BUZZ_HTTP_PORT:-3000}:3000"
    volumes:
      - buzz-git-data:/data/git
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "bash -ec 'exec 3<>/dev/tcp/127.0.0.1/8080; printf \"GET /_readiness HTTP/1.1\\r\\nHost: 127.0.0.1\\r\\nConnection: close\\r\\n\\r\\n\" >&3; grep -q \"200 OK\" <&3'"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 30s
    labels:
      com.gbuzz.recovery.enabled: "true"
      com.gbuzz.recovery.stack: ${RECOVERY_STACK_ID:-gbuzz}
      com.gbuzz.recovery.service: relay
      com.gbuzz.recovery.action: restart
    networks: [buzz-net, data-net]

  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-buzz}
      POSTGRES_USER: ${POSTGRES_USER:-buzz}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - buzz-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    labels:
      com.gbuzz.recovery.enabled: "true"
      com.gbuzz.recovery.stack: ${RECOVERY_STACK_ID:-gbuzz}
      com.gbuzz.recovery.service: postgres
      com.gbuzz.recovery.action: monitor
    networks: [data-net]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD}"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD}
    volumes:
      - buzz-redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    labels:
      com.gbuzz.recovery.enabled: "true"
      com.gbuzz.recovery.stack: ${RECOVERY_STACK_ID:-gbuzz}
      com.gbuzz.recovery.service: redis
      com.gbuzz.recovery.action: monitor
    networks: [data-net]

  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${BUZZ_S3_ACCESS_KEY:?set BUZZ_S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${BUZZ_S3_SECRET_KEY:?set BUZZ_S3_SECRET_KEY}
    ports:
      - "${MINIO_BIND_ADDR:-127.0.0.1}:${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_BIND_ADDR:-127.0.0.1}:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - buzz-minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    labels:
      com.gbuzz.recovery.enabled: "true"
      com.gbuzz.recovery.stack: ${RECOVERY_STACK_ID:-gbuzz}
      com.gbuzz.recovery.service: minio
      com.gbuzz.recovery.action: monitor
    networks: [buzz-net, data-net]

  minio-init:
    image: quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    environment:
      BUZZ_S3_ACCESS_KEY: ${BUZZ_S3_ACCESS_KEY:?set BUZZ_S3_ACCESS_KEY}
      BUZZ_S3_SECRET_KEY: ${BUZZ_S3_SECRET_KEY:?set BUZZ_S3_SECRET_KEY}
      BUZZ_S3_BUCKET: ${BUZZ_S3_BUCKET:-buzz-media}
      GCOR_S3_BUCKET: ${GCOR_S3_BUCKET:-buzz-gcor}
      GCOR_S3_ACCESS_KEY: ${GCOR_S3_ACCESS_KEY:-}
      GCOR_S3_SECRET_KEY: ${GCOR_S3_SECRET_KEY:-}
      GCOR_CHANNEL_BUCKET_PREFIX: ${GCOR_CHANNEL_BUCKET_PREFIX:-}
    # Creates the relay media bucket and, when GCOR_S3_ACCESS_KEY/SECRET_KEY are set,
    # a GCOR service user whose policy covers only the GCOR bucket and channel buckets
    # under GCOR_CHANNEL_BUCKET_PREFIX (plus bucket listing). Root keys stay with the
    # relay and this initializer.
    entrypoint: >
      /bin/sh -euc '
        mc alias set local http://minio:9000 "$${BUZZ_S3_ACCESS_KEY}" "$${BUZZ_S3_SECRET_KEY}"
        mc mb --ignore-existing "local/$${BUZZ_S3_BUCKET}"
        mc anonymous set none "local/$${BUZZ_S3_BUCKET}"
        mc version enable "local/$${BUZZ_S3_BUCKET}"
        mc mb --ignore-existing "local/$${GCOR_S3_BUCKET}"
        mc anonymous set none "local/$${GCOR_S3_BUCKET}"
        mc version enable "local/$${GCOR_S3_BUCKET}"
        if [ -n "$${GCOR_S3_SECRET_KEY}" ]; then
          if [ -z "$${GCOR_S3_ACCESS_KEY}" ] || [ -z "$${GCOR_CHANNEL_BUCKET_PREFIX}" ]; then
            echo "GCOR_S3_ACCESS_KEY and GCOR_CHANNEL_BUCKET_PREFIX are required with GCOR_S3_SECRET_KEY" >&2; exit 1
          fi
          printf "%s" "{\"Version\":\"2012-10-17\",\"Statement\":[{\"Effect\":\"Allow\",\"Action\":[\"s3:ListAllMyBuckets\"],\"Resource\":[\"arn:aws:s3:::*\"]},{\"Effect\":\"Allow\",\"Action\":[\"s3:*\"],\"Resource\":[\"arn:aws:s3:::$${GCOR_S3_BUCKET}\",\"arn:aws:s3:::$${GCOR_S3_BUCKET}/*\",\"arn:aws:s3:::$${GCOR_CHANNEL_BUCKET_PREFIX}*\",\"arn:aws:s3:::$${GCOR_CHANNEL_BUCKET_PREFIX}*/*\"]}]}" > /tmp/gcor-service-policy.json
          mc admin policy create local gcor-service /tmp/gcor-service-policy.json
          mc admin user add local "$${GCOR_S3_ACCESS_KEY}" "$${GCOR_S3_SECRET_KEY}"
          mc admin policy attach local gcor-service --user "$${GCOR_S3_ACCESS_KEY}" || true
          echo "scoped object credentials ready for $${GCOR_S3_ACCESS_KEY}"
        fi
      '
    networks: [data-net]

  ollama:
    # Pinned to the digest recorded in docker-compose.production.lock.yml; override OLLAMA_IMAGE to upgrade deliberately.
    image: ${OLLAMA_IMAGE:-ollama/ollama@sha256:d5034f60974be528e0a5523ba5e89156e4a9ffd12d0b2b18475fb148237f3d4c}
    restart: unless-stopped
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    labels:
      com.gbuzz.recovery.enabled: "true"
      com.gbuzz.recovery.stack: ${RECOVERY_STACK_ID:-gbuzz}
      com.gbuzz.recovery.service: ollama
      com.gbuzz.recovery.action: monitor
    networks: [buzz-net]

  ollama-init:
    # Pinned to the digest recorded in docker-compose.production.lock.yml; override OLLAMA_IMAGE to upgrade deliberately.
    image: ${OLLAMA_IMAGE:-ollama/ollama@sha256:d5034f60974be528e0a5523ba5e89156e4a9ffd12d0b2b18475fb148237f3d4c}
    restart: "no"
    depends_on:
      ollama:
        condition: service_healthy
    entrypoint: ["sh", "-c"]
    environment:
      OLLAMA_HOST: ollama:11434
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-nomic-embed-text}
      GENERATION_MODEL: ${GENERATION_MODEL:-qwen2.5:1.5b}
    command: ["ollama pull \"$${EMBEDDING_MODEL}\" && ollama pull \"$${GENERATION_MODEL}\""]
    volumes:
      - ollama-data:/root/.ollama
    networks: [buzz-net]

  gcor-migrate:
    image: pgvector/pgvector:pg17
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: ${POSTGRES_USER:-buzz}
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB:-buzz}
      EMBEDDING_DIMS: ${EMBEDDING_DIMS:-768}
      GCOR_DB_USER: ${GCOR_DB_USER:-}
      GCOR_DB_PASSWORD: ${GCOR_DB_PASSWORD:-}
    volumes:
      - ./migrations:/migrations:ro
    command: ["/bin/sh", "/migrations/apply.sh"]
    networks: [data-net]

  gcor-proxy:
    build:
      context: .
      dockerfile: proxy/Dockerfile
    restart: unless-stopped
    depends_on:
      gcor-migrate:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
      ollama-init:
        condition: service_completed_successfully
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${GCOR_DB_USER:-${POSTGRES_USER:-buzz}}
      POSTGRES_PASSWORD: ${GCOR_DB_PASSWORD:-${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}}
      POSTGRES_DB: ${POSTGRES_DB:-buzz}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER: ${GCOR_S3_ACCESS_KEY:-${BUZZ_S3_ACCESS_KEY:?set BUZZ_S3_ACCESS_KEY}}
      MINIO_ROOT_PASSWORD: ${GCOR_S3_SECRET_KEY:-${BUZZ_S3_SECRET_KEY:?set BUZZ_S3_SECRET_KEY}}
      MINIO_BUCKET: ${GCOR_S3_BUCKET:-buzz-gcor}
      GCOR_CHANNEL_BUCKET_PREFIX: ${GCOR_CHANNEL_BUCKET_PREFIX:-}
      # Self-contained by default: local Ollama embeddings. Selecting openai sends content off-host.
      EMBEDDING_BACKEND: ${EMBEDDING_BACKEND:-ollama}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-nomic-embed-text}
      GENERATION_MODEL: ${GENERATION_MODEL:-qwen2.5:1.5b}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OLLAMA_HOST: ${OLLAMA_HOST:-http://ollama:11434}
      INGEST_WEBHOOK_SECRET: ${INGEST_WEBHOOK_SECRET:?set INGEST_WEBHOOK_SECRET}
      STACK_API_SECRET: ${STACK_API_SECRET:-}
      RECOVERY_CONTROLLER_URL: http://recovery-controller:8080
      ENFORCE_STACK_API_SECRET: ${ENFORCE_STACK_API_SECRET:-true}
      GCOR_WORKLOAD_CREDENTIALS: ${GCOR_WORKLOAD_CREDENTIALS:-[]}
      MAX_ATTACHMENTS_PER_REQUEST: ${MAX_ATTACHMENTS_PER_REQUEST:-100}
      MAX_INGEST_FILE_BYTES: ${MAX_INGEST_FILE_BYTES:-26214400}
      MAX_REQUEST_BODY_BYTES: ${MAX_REQUEST_BODY_BYTES:-27262976}
      MAX_API_IN_FLIGHT: ${MAX_API_IN_FLIGHT:-4}
      MAX_API_QUEUED: ${MAX_API_QUEUED:-32}
      API_QUEUE_SECONDS: ${API_QUEUE_SECONDS:-10}
      GCOR_STATEMENT_TIMEOUT_MS: ${GCOR_STATEMENT_TIMEOUT_MS:-30000}
      RETRIEVAL_VECTOR_WEIGHT: ${RETRIEVAL_VECTOR_WEIGHT:-0.5}
      RETRIEVAL_MIN_VECTOR_SCORE: ${RETRIEVAL_MIN_VECTOR_SCORE:-0.45}
      RETRIEVAL_MAX_CHUNKS_PER_DOCUMENT: ${RETRIEVAL_MAX_CHUNKS_PER_DOCUMENT:-0}
      RETRIEVAL_IDENTIFIER_WEIGHT: ${RETRIEVAL_IDENTIFIER_WEIGHT:-0.5}
      UNANSWERED_QUEUE_ENABLED: ${UNANSWERED_QUEUE_ENABLED:-true}
      UNANSWERED_RETENTION_DAYS: ${UNANSWERED_RETENTION_DAYS:-90}
      HNSW_ITERATIVE_SCAN: ${HNSW_ITERATIVE_SCAN:-auto}
      HNSW_EF_SEARCH: ${HNSW_EF_SEARCH:-0}
      # Optional local reranker (docker-compose.reranker.yml). Empty = disabled.
      RERANKER_URL: ${RERANKER_URL:-}
      RERANKER_MODEL: ${RERANKER_MODEL:-bge-reranker-v2-m3}
      RERANK_CANDIDATES: ${RERANK_CANDIDATES:-12}
      RERANK_TIMEOUT_SECONDS: ${RERANK_TIMEOUT_SECONDS:-3}
      INGESTION_JOB_MAX_ATTEMPTS: ${INGESTION_JOB_MAX_ATTEMPTS:-12}
      INGESTION_JOB_LEASE_SECONDS: ${INGESTION_JOB_LEASE_SECONDS:-60}
      REQUEST_BODY_TIMEOUT_SECONDS: ${REQUEST_BODY_TIMEOUT_SECONDS:-60}
      MAX_QUERY_CHARS: ${MAX_QUERY_CHARS:-10000}
      MAX_ATTACHMENT_TOTAL_BYTES: ${MAX_ATTACHMENT_TOTAL_BYTES:-104857600}
      ATTACHMENT_REPLAY_BUDGET_SECONDS: ${ATTACHMENT_REPLAY_BUDGET_SECONDS:-120}
      REMOTE_FETCH_TOTAL_TIMEOUT_SECONDS: ${REMOTE_FETCH_TOTAL_TIMEOUT_SECONDS:-60}
      REMOTE_FETCH_ALLOWED_HOSTS: ${REMOTE_FETCH_ALLOWED_HOSTS:-}
      REMOTE_FETCH_BLOCK_PRIVATE_HOSTS: ${REMOTE_FETCH_BLOCK_PRIVATE_HOSTS:-true}
      AUDIT_PACK_SIGNING_KEY: ${AUDIT_PACK_SIGNING_KEY:-}
      AUDIT_PACK_MAX_EVENTS: ${AUDIT_PACK_MAX_EVENTS:-5000}
      AUDIT_PACK_MAX_BYTES: ${AUDIT_PACK_MAX_BYTES:-104857600}
      AUDIT_PACK_MAX_RANGE_DAYS: ${AUDIT_PACK_MAX_RANGE_DAYS:-366}
      BUZZ_MEDIA_BUCKET: ${BUZZ_MEDIA_BUCKET:-buzz-media}
    ports:
      - "${GCOR_PROXY_BIND_ADDR:-127.0.0.1}:${GCOR_PROXY_PORT:-5001}:5001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5001/health')"]
      interval: 10s
      timeout: 3s
      retries: 12
    labels:
      com.gbuzz.recovery.enabled: "true"
      com.gbuzz.recovery.stack: ${RECOVERY_STACK_ID:-gbuzz}
      com.gbuzz.recovery.service: gcor-proxy
      com.gbuzz.recovery.action: restart
    networks: [buzz-net, data-net]

  mcp-postgres-gcor:
    build: ./mcp-postgres-gcor
    restart: unless-stopped
    depends_on:
      gcor-proxy:
        condition: service_healthy
    environment:
      GCOR_PROXY_URL: http://gcor-proxy:5001
      INGEST_WEBHOOK_SECRET: ${INGEST_WEBHOOK_SECRET:?set INGEST_WEBHOOK_SECRET}
      STACK_API_SECRET: ${STACK_API_SECRET:-}
    ports:
      - "${GCOR_MCP_BIND_ADDR:-127.0.0.1}:${GCOR_MCP_PORT:-8765}:8765"
    labels:
      com.gbuzz.recovery.enabled: "true"
      com.gbuzz.recovery.stack: ${RECOVERY_STACK_ID:-gbuzz}
      com.gbuzz.recovery.service: mcp-postgres-gcor
      com.gbuzz.recovery.action: restart
    networks: [buzz-net]

  gcor-event-projector:
    build:
      context: .
      dockerfile: projector/Dockerfile
    restart: unless-stopped
    depends_on:
      relay:
        condition: service_healthy
      gcor-proxy:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${GCOR_DB_USER:-${POSTGRES_USER:-buzz}}
      POSTGRES_PASSWORD: ${GCOR_DB_PASSWORD:-${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}}
      POSTGRES_DB: ${POSTGRES_DB:-buzz}
      GCOR_PROXY_URL: http://gcor-proxy:5001
      BUZZ_RELAY_HTTP_URL: http://relay:3000
      STACK_API_SECRET: ${STACK_API_SECRET:-}
      INGEST_WEBHOOK_SECRET: ${INGEST_WEBHOOK_SECRET:?set INGEST_WEBHOOK_SECRET}
      PROJECTOR_WORKLOAD_TOKEN: ${PROJECTOR_WORKLOAD_TOKEN:-}
      PROJECTOR_POLL_SECONDS: ${PROJECTOR_POLL_SECONDS:-2}
      PROJECTOR_BATCH_SIZE: ${PROJECTOR_BATCH_SIZE:-50}
      PROJECTOR_EVENT_KINDS: ${PROJECTOR_EVENT_KINDS:-9,40002,45001,45003}
      PROJECTOR_KNOWLEDGE_MODE: ${PROJECTOR_KNOWLEDGE_MODE:-selective}
    labels:
      com.gbuzz.recovery.enabled: "true"
      com.gbuzz.recovery.stack: ${RECOVERY_STACK_ID:-gbuzz}
      com.gbuzz.recovery.service: gcor-event-projector
      com.gbuzz.recovery.action: restart
    networks: [buzz-net, data-net]

  docker-socket-proxy:
    # The only holder of the Docker Engine socket. It forwards container listing,
    # inspection and restart requests and rejects everything else (exec, create,
    # images, volumes, networks, swarm, system). Reachable solely on control-net.
    image: tecnativa/docker-socket-proxy:latest
    restart: unless-stopped
    environment:
      CONTAINERS: "1"
      ALLOW_RESTARTS: "1"
      POST: "0"
      EVENTS: "0"
      PING: "1"
      VERSION: "0"
      LOG_LEVEL: warning
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    security_opt:
      - no-new-privileges:true
    networks: [control-net]

  recovery-controller:
    build:
      context: .
      dockerfile: recovery-controller/Dockerfile
    restart: unless-stopped
    environment:
      RECOVERY_STACK_ID: ${RECOVERY_STACK_ID:-gbuzz}
      RECOVERY_POLL_SECONDS: ${RECOVERY_POLL_SECONDS:-15}
      RECOVERY_FAILURE_THRESHOLD: ${RECOVERY_FAILURE_THRESHOLD:-3}
      RECOVERY_COOLDOWN_SECONDS: ${RECOVERY_COOLDOWN_SECONDS:-300}
      RECOVERY_MAX_ACTIONS_PER_WINDOW: ${RECOVERY_MAX_ACTIONS_PER_WINDOW:-3}
      RECOVERY_ACTION_WINDOW_SECONDS: ${RECOVERY_ACTION_WINDOW_SECONDS:-3600}
      RECOVERY_RESTART_TIMEOUT_SECONDS: ${RECOVERY_RESTART_TIMEOUT_SECONDS:-20}
      RECOVERY_AUDIT_PATH: /var/lib/gbuzz-recovery/audit.jsonl
      DOCKER_HOST: tcp://docker-socket-proxy:2375
    depends_on:
      docker-socket-proxy:
        condition: service_started
    volumes:
      - recovery-audit-data:/var/lib/gbuzz-recovery
    ports:
      - "${RECOVERY_BIND_ADDR:-127.0.0.1}:${RECOVERY_PORT:-8082}:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    networks: [buzz-net, control-net]

volumes:
  buzz-postgres-data:
  buzz-redis-data:
  buzz-minio-data:
  buzz-git-data:
  ollama-data:
  recovery-audit-data:

networks:
  # Application network: services that need each other, host ports or egress.
  buzz-net:
    driver: bridge
  # Authoritative stores. Internal: no egress, no published ports; joined only by
  # the relay, GCOR services, migrations and exporters that read them.
  data-net:
    driver: bridge
    internal: true
  # Docker Engine control path: socket proxy and recovery controller only.
  control-net:
    driver: bridge
    internal: true
