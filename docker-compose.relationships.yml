services:
  gcor-relationship-migrate:
    profiles: ["relationship-projection"]
    image: pgvector/pgvector:pg17@sha256:cf134a767f474095eeba57e0117be8e568e011a63f33fbf252f14c9b760f8e6f
    restart: "no"
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGUSER: ${POSTGRES_USER:-buzz}
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB:-gcor}
    volumes:
      - ./relationship-projector/migrations:/relationship-migrations:ro
    entrypoint: ["/bin/sh", "-ec"]
    command: ["for migration in /relationship-migrations/*.sql; do psql -v ON_ERROR_STOP=1 -f \"$$migration\"; done"]
    depends_on:
      gcor-migrate: {condition: service_completed_successfully}
    networks: [data-net]

  gcor-relationship-projector:
    profiles: ["relationship-projection"]
    build:
      context: .
      dockerfile: relationship-projector/Dockerfile
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    networks: [buzz-net, data-net]
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${GCOR_RELATIONSHIP_DB_USER:?set GCOR_RELATIONSHIP_DB_USER}
      POSTGRES_PASSWORD: ${GCOR_RELATIONSHIP_DB_PASSWORD:?set GCOR_RELATIONSHIP_DB_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-gcor}
      OLLAMA_HOST: http://ollama:11434
      RELATIONSHIP_MODEL: ${RELATIONSHIP_MODEL:-qwen2.5:1.5b}
      RELATIONSHIP_POLL_SECONDS: ${RELATIONSHIP_POLL_SECONDS:-10}
      RELATIONSHIP_MAX_ATTEMPTS: ${RELATIONSHIP_MAX_ATTEMPTS:-8}
      # Bi-temporal facts (gcor.facts, migration 0018). Set false to keep entity/claim projection only.
      RELATIONSHIP_TEMPORAL_FACTS: ${RELATIONSHIP_TEMPORAL_FACTS:-true}
    depends_on:
      gcor-relationship-migrate: {condition: service_completed_successfully}
      ollama: {condition: service_healthy}
    mem_limit: 256m
    cpus: 0.50
