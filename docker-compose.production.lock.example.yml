# Copy to docker-compose.production.lock.yml (gitignored), replace each digest,
# and run scripts/verify-production-pins.ps1 before deployment.
services:
  relay:
    image: ghcr.io/block/buzz@sha256:REPLACE_WITH_64_HEX_CHARACTERS
  postgres:
    image: pgvector/pgvector@sha256:REPLACE_WITH_64_HEX_CHARACTERS
  redis:
    image: redis@sha256:REPLACE_WITH_64_HEX_CHARACTERS
  minio:
    image: quay.io/minio/minio@sha256:REPLACE_WITH_64_HEX_CHARACTERS
  minio-init:
    image: quay.io/minio/mc@sha256:REPLACE_WITH_64_HEX_CHARACTERS
  ollama:
    image: ollama/ollama@sha256:REPLACE_WITH_64_HEX_CHARACTERS
  ollama-init:
    image: ollama/ollama@sha256:REPLACE_WITH_64_HEX_CHARACTERS
  gcor-migrate:
    image: pgvector/pgvector@sha256:REPLACE_WITH_64_HEX_CHARACTERS
  gcor-proxy:
    image: gbuzz-gcor-proxy:REPLACE_WITH_GIT_COMMIT
  mcp-postgres-gcor:
    image: gbuzz-mcp-postgres-gcor:REPLACE_WITH_GIT_COMMIT
  gcor-event-projector:
    image: gbuzz-event-projector:REPLACE_WITH_GIT_COMMIT
  recovery-controller:
    image: gbuzz-recovery-controller:REPLACE_WITH_GIT_COMMIT
  prometheus:
    image: prom/prometheus@sha256:REPLACE_WITH_64_HEX_CHARACTERS
  grafana:
    image: grafana/grafana@sha256:REPLACE_WITH_64_HEX_CHARACTERS
  alertmanager:
    image: prom/alertmanager@sha256:REPLACE_WITH_64_HEX_CHARACTERS
  alert-receiver:
    image: gbuzz-alert-receiver:REPLACE_WITH_GIT_COMMIT
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter@sha256:REPLACE_WITH_64_HEX_CHARACTERS
  redis-exporter:
    image: oliver006/redis_exporter@sha256:REPLACE_WITH_64_HEX_CHARACTERS
  node-exporter:
    image: quay.io/prometheus/node-exporter@sha256:REPLACE_WITH_64_HEX_CHARACTERS
