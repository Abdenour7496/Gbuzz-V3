name: Publish release images

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

concurrency:
  group: release-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish ${{ matrix.image }}
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: gcor-proxy
            context: .
            dockerfile: proxy/Dockerfile
          - image: mcp-postgres-gcor
            context: mcp-postgres-gcor
            dockerfile: mcp-postgres-gcor/Dockerfile
          - image: graphiti-mcp
            context: graphiti-mcp
            dockerfile: graphiti-mcp/Dockerfile
          - image: graphiti-projector
            context: .
            dockerfile: graphiti-projector/Dockerfile
          - image: gcor-event-projector
            context: .
            dockerfile: projector/Dockerfile
          - image: recovery-controller
            context: .
            dockerfile: recovery-controller/Dockerfile
          - image: alert-receiver
            context: .
            dockerfile: observability/alert-receiver/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/gbuzz-${{ matrix.image }}:${{ github.sha }}
          provenance: mode=max
          sbom: true
      - name: Record immutable image reference
        shell: bash
        run: |
          mkdir -p image-digests
          printf '%s\n' 'ghcr.io/${{ github.repository_owner }}/gbuzz-${{ matrix.image }}@${{ steps.build.outputs.digest }}' > 'image-digests/${{ matrix.image }}.txt'
      - uses: actions/upload-artifact@v4
        with:
          name: image-${{ matrix.image }}
          path: image-digests/*.txt
          retention-days: 90

  evidence:
    name: Collect release image evidence
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: image-*
          path: image-digests
          merge-multiple: true
      - name: Create manifest
        shell: bash
        run: |
          find image-digests -type f -name '*.txt' -print0 | sort -z | xargs -0 cat > gbuzz-release-images.txt
      - uses: actions/upload-artifact@v4
        with:
          name: gbuzz-release-image-manifest
          path: gbuzz-release-images.txt
          retention-days: 90
