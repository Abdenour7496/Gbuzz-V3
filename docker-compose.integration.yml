name: gbuzz-integration

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: integration
      POSTGRES_USER: integration
      POSTGRES_PASSWORD: integration
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U integration -d integration"]
      interval: 2s
      timeout: 3s
      retries: 30
    networks: [integration]

  minio:
    # CI stand-in for MinIO (S3 API incl. versioning and conditional writes); see the Dockerfile.
    build:
      context: .
      dockerfile: tests/integration/s3-mock.Dockerfile
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9000/')"]
      interval: 2s
      timeout: 3s
      retries: 30
    networks: [integration]

  migrate:
    image: pgvector/pgvector:pg17
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGUSER: integration
      PGPASSWORD: integration
      PGDATABASE: integration
      EMBEDDING_DIMS: "8"
      GCOR_DB_USER: gcor_runtime
      GCOR_DB_PASSWORD: runtime-secret
    volumes:
      - ./migrations:/migrations:ro
    command: ["/bin/sh", "/migrations/apply.sh"]
    networks: [integration]

  relationship-migrate:
    profiles: ["relationship-projection"]
    image: pgvector/pgvector:pg17
    depends_on:
      migrate: {condition: service_completed_successfully}
    environment:
      PGHOST: postgres
      PGUSER: integration
      PGPASSWORD: integration
      PGDATABASE: integration
    volumes:
      - ./relationship-projector/migrations:/relationship-migrations:ro
    command: ["/bin/sh", "-ec", "for migration in /relationship-migrations/*.sql; do psql -v ON_ERROR_STOP=1 -f \"$$migration\"; done; psql -v ON_ERROR_STOP=1 -c \"CREATE ROLE relationship_integration LOGIN PASSWORD 'relationship-secret'; GRANT gcor_relationship_projector TO relationship_integration\""]
    networks: [integration]

  relationship-facts-check:
    # Bi-temporal facts end to end with the projector's own code and restricted role.
    profiles: ["relationship-projection"]
    build:
      context: .
      dockerfile: relationship-projector/Dockerfile
    depends_on:
      relationship-migrate: {condition: service_completed_successfully}
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: integration
      PYTHONPATH: /app
    volumes:
      - ./tests/integration:/checks:ro
    command: ["python", "/checks/temporal_facts_projection.py"]
    networks: [integration]

  mock-ollama:
    build:
      context: .
      dockerfile: tests/integration/mock-ollama.Dockerfile
    networks: [integration]

  gcor-proxy:
    build:
      context: .
      dockerfile: proxy/Dockerfile
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio:
        condition: service_healthy
      mock-ollama:
        condition: service_started
      parser-worker:
        condition: service_started
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_USER: gcor_runtime
      POSTGRES_PASSWORD: runtime-secret
      POSTGRES_ADMIN_USER: integration
      POSTGRES_ADMIN_PASSWORD: integration
      POSTGRES_DB: integration
      GCOR_OBJECT_STORE: ${INTEGRATION_OBJECT_STORE:-postgres}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER: integration
      MINIO_ROOT_PASSWORD: integration-secret
      MINIO_BUCKET: integration
      EMBEDDING_BACKEND: ollama
      EMBEDDING_MODEL: integration
      OLLAMA_HOST: http://mock-ollama:11434
      INGEST_WEBHOOK_SECRET: integration-secret
      STACK_API_SECRET: integration-secret
      AUDIT_PACK_SIGNING_KEY: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      ENFORCE_STACK_API_SECRET: "true"
      GCOR_ALLOW_UNSCOPED_LEGACY: "true"
      SCHEMAS_DIR: /app/schemas
      PARSER_SOCKET_PATH: /run/parser/parser.sock
    volumes:
      - parser-socket:/run/parser
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5001/health')"]
      interval: 2s
      timeout: 3s
      retries: 30
    networks: [integration]

  parser-socket-init:
    image: alpine:3.22.1
    network_mode: none
    volumes:
      - parser-socket:/run/parser
    command: ["sh", "-c", "chown 10001:10001 /run/parser && chmod 770 /run/parser"]

  parser-worker:
    build:
      context: .
      dockerfile: parser-worker/Dockerfile
    depends_on:
      parser-socket-init:
        condition: service_completed_successfully
    restart: unless-stopped
    network_mode: none
    read_only: true
    user: "10001:10001"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 64
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    volumes:
      - parser-socket:/run/parser
    healthcheck:
      test: ["CMD", "python", "-c", "import os,socket; s=socket.socket(socket.AF_UNIX); s.settimeout(2); s.connect(os.environ.get('PARSER_SOCKET_PATH','/run/parser/parser.sock')); s.close()"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 5s

  smoke:
    image: python:3.12-slim
    depends_on:
      gcor-proxy:
        condition: service_healthy
    environment:
      GCOR_URL: http://gcor-proxy:5001
      STACK_API_SECRET: integration-secret
    volumes:
      - ./tests/integration:/tests:ro
    command: ["python", "/tests/smoke.py"]
    networks: [integration]

networks:
  integration:

volumes:
  parser-socket:
